<html lang="th">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPGA STUDIO — 03. FEATURES // ORBIT LAUNCH</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600;800;900&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600;700&family=Prompt:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/nothing.css">
</head>
<body class="h-screen w-screen flex flex-col justify-between p-6 relative overflow-hidden">

    <!-- Interactive Warping Dot Matrix Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- TOP BAR (CLEAN MINIMAL INDUSTRIAL) -->
    <header class="w-full flex items-center justify-between pb-3 border-b border-[#242424] z-20">
        <div class="flex items-center space-x-3">
            <span class="glyph-green-dot"></span>
            <span class="mono text-xs text-[#EAEAEA] font-bold tracking-widest uppercase">FPGA STUDIO</span>
            <span class="text-white/20 text-xs">|</span>
            <span class="mono text-xs text-[#1ED760]">ORBIT // 7 CORE FEATURES</span>
        </div>

        <div class="flex items-center space-x-4">
            <div class="mono text-sm font-bold tracking-widest text-[#EAEAEA]">
                <span id="current-slide-num">03</span> <span class="text-white/30">/</span> <span id="total-slide-num">05</span>
            </div>
            <button onclick="toggleFullscreen()" class="p-2 rounded-full border border-[#282828] hover:border-[#484848] hover:bg-[#2A2A2A] transition text-xs mono text-[#B3B3B3]" title="Full Screen (F)">
                ⛶
            </button>
        </div>
    </header>

    <!-- MAIN SLIDE CONTAINER (CAROUSEL VIEWPORT) -->
    <main class="flex-1 w-full flex items-center justify-center py-2 relative z-10 overflow-hidden">
        <div id="carousel-viewport">
            <div id="carousel-track">

                <!-- ======================================================== -->
                <!-- SLIDE 3: ORBIT LAUNCH — FEATURES ON A PLANET HORIZON      -->
                <!-- ======================================================== -->
                <section class="slide active fx-slide w-full h-full" data-slide="3" data-speaker="SPEAKER // SYSTEM FEATURES">

                    <style>
                        @property --fx-a {
                            syntax: '<angle>';
                            inherits: false;
                            initial-value: 0deg;
                        }

                        .fx-slide {
                            position: relative;
                            padding: 0 !important;
                            display: block !important;
                            --R: 1150px;          /* planet radius */
                            --horizon: clamp(120px, 19vh, 190px); /* how much planet rises from the bottom */
                            --lift: 44px;         /* orb float height above the rim */
                            --step: 9deg;         /* angular distance between features */
                            --g: #1ED760;
                        }

                        .fx-root {
                            position: absolute;
                            inset: 0;
                            overflow: hidden;
                            border-radius: 28px;
                            background: #020403;
                            font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif;
                            -webkit-font-smoothing: antialiased;
                        }

                        /* ---------- Typography ---------- */
                        .fx-dot { font-family: 'Doto', 'IBM Plex Sans Thai', monospace; font-weight: 900; letter-spacing: 0.02em; }
                        .fx-mono { font-family: 'JetBrains Mono', monospace; }
                        .fx-thai { font-family: 'IBM Plex Sans Thai', 'Inter', sans-serif; }

                        /* ---------- Deep space layers ---------- */
                        .fx-stars { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

                        .fx-nebula {
                            position: absolute; inset: -10%; z-index: 0; pointer-events: none;
                            background:
                                radial-gradient(40% 35% at 18% 28%, rgba(30, 215, 96, 0.10), transparent 70%),
                                radial-gradient(35% 30% at 82% 18%, rgba(56, 189, 248, 0.08), transparent 70%),
                                radial-gradient(30% 30% at 65% 60%, rgba(139, 92, 246, 0.06), transparent 70%);
                            animation: fxNebula 26s ease-in-out infinite alternate;
                        }
                        @keyframes fxNebula {
                            0%   { transform: translate3d(0, 0, 0) scale(1); }
                            100% { transform: translate3d(-2%, 1.5%, 0) scale(1.06); }
                        }

                        .fx-grid {
                            position: absolute; inset: 0; z-index: 0; pointer-events: none;
                            background-image:
                                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
                            background-size: 64px 64px;
                            mask-image: radial-gradient(70% 60% at 50% 40%, black, transparent 80%);
                            -webkit-mask-image: radial-gradient(70% 60% at 50% 40%, black, transparent 80%);
                        }

                        /* Aurora glow rising above the horizon */
                        .fx-aurora {
                            position: absolute; left: 50%; bottom: calc(var(--horizon) - 60px);
                            width: 120%; height: 380px; transform: translateX(-50%);
                            background: radial-gradient(50% 50% at 50% 100%, rgba(30, 215, 96, 0.22), rgba(56, 189, 248, 0.06) 45%, transparent 75%);
                            filter: blur(10px);
                            z-index: 1; pointer-events: none;
                            animation: fxAurora 6s ease-in-out infinite;
                        }
                        @keyframes fxAurora {
                            0%, 100% { opacity: 0.75; }
                            50% { opacity: 1; }
                        }

                        /* ---------- Planet ---------- */
                        .fx-planet {
                            position: absolute; left: 50%; top: calc(100% - var(--horizon));
                            width: calc(var(--R) * 2); height: calc(var(--R) * 2);
                            transform: translateX(-50%);
                            border-radius: 50%;
                            z-index: 2; pointer-events: none;
                            background: radial-gradient(circle at 50% 0%, #0b1a12 0%, #040806 18%, #010201 40%);
                            box-shadow:
                                0 -1px 0 rgba(30, 215, 96, 0.85),
                                0 -8px 30px rgba(30, 215, 96, 0.35),
                                0 -40px 120px rgba(30, 215, 96, 0.18),
                                inset 0 18px 40px rgba(30, 215, 96, 0.16);
                        }
                        /* dot-matrix surface (Nothing-style) */
                        .fx-planet::before {
                            content: ''; position: absolute; inset: 0; border-radius: 50%;
                            background-image: radial-gradient(rgba(30, 215, 96, 0.35) 1.1px, transparent 1.6px);
                            background-size: 16px 16px;
                            mask-image: radial-gradient(circle at 50% 0%, black 0%, rgba(0,0,0,0.5) 6%, transparent 14%);
                            -webkit-mask-image: radial-gradient(circle at 50% 0%, black 0%, rgba(0,0,0,0.5) 6%, transparent 14%);
                        }
                        /* rim shine */
                        .fx-planet::after {
                            content: ''; position: absolute; inset: 0; border-radius: 50%;
                            background: conic-gradient(from 300deg, transparent 0deg, rgba(255,255,255,0.0) 20deg, rgba(190, 255, 215, 0.55) 60deg, rgba(255,255,255,0.0) 100deg, transparent 360deg);
                            mask-image: radial-gradient(circle, transparent calc(var(--R) - 2px), black calc(var(--R) - 1px));
                            -webkit-mask-image: radial-gradient(circle, transparent calc(var(--R) - 2px), black calc(var(--R) - 1px));
                            opacity: 0.8;
                        }

                        .fx-orbit-ring {
                            position: absolute; left: 50%;
                            top: calc(100% - var(--horizon) - var(--lift));
                            width: calc((var(--R) + var(--lift)) * 2); height: calc((var(--R) + var(--lift)) * 2);
                            transform: translateX(-50%);
                            border-radius: 50%;
                            border: 1px dashed rgba(255, 255, 255, 0.10);
                            z-index: 2; pointer-events: none;
                        }

                        /* ---------- Orbiting feature orbs ---------- */
                        .fx-pivot {
                            position: absolute; left: 50%;
                            top: calc(100% - var(--horizon) + var(--R));
                            width: 0; height: 0;
                            z-index: 30;
                        }
                        .fx-orb-pos {
                            position: absolute; left: 0; top: 0;
                            --fx-a: 0deg;
                            transform: rotate(var(--fx-a)) translateY(calc(-1 * (var(--R) + var(--lift)))) rotate(calc(-1 * var(--fx-a)));
                            transition: --fx-a 1.05s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
                        }
                        .fx-orb-float {
                            position: absolute; left: 0; top: 0;
                            animation: fxBob 4.8s ease-in-out infinite;
                        }
                        @keyframes fxBob {
                            0%, 100% { transform: translateY(0); }
                            50% { transform: translateY(-9px); }
                        }
                        .fx-orb {
                            position: absolute;
                            width: 58px; height: 58px; left: -29px; top: -29px;
                            border-radius: 50%;
                            display: flex; align-items: center; justify-content: center;
                            cursor: pointer;
                            color: rgba(255, 255, 255, 0.78);
                            background:
                                radial-gradient(circle at 30% 24%, rgba(255,255,255,0.22), rgba(255,255,255,0.03) 42%, rgba(0,0,0,0.55) 100%),
                                rgba(12, 16, 14, 0.75);
                            border: 1px solid rgba(255, 255, 255, 0.16);
                            backdrop-filter: blur(10px);
                            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -10px 18px rgba(0,0,0,0.5);
                            transition: width 0.5s cubic-bezier(0.22,1,0.36,1), height 0.5s cubic-bezier(0.22,1,0.36,1), left 0.5s cubic-bezier(0.22,1,0.36,1), top 0.5s cubic-bezier(0.22,1,0.36,1), color 0.4s, border-color 0.4s, box-shadow 0.4s;
                        }
                        .fx-orb svg { width: 24px; height: 24px; transition: transform 0.5s cubic-bezier(0.22,1,0.36,1), filter 0.4s; }
                        .fx-orb:hover { color: #fff; border-color: rgba(255,255,255,0.45); }

                        .fx-orb.active {
                            width: 82px; height: 82px; left: -41px; top: -41px;
                            color: var(--g);
                            border-color: rgba(30, 215, 96, 0.9);
                            background:
                                radial-gradient(circle at 30% 24%, rgba(190,255,215,0.30), rgba(30,215,96,0.10) 45%, rgba(0,0,0,0.6) 100%),
                                rgba(6, 20, 12, 0.85);
                            box-shadow: 0 0 0 6px rgba(30,215,96,0.07), 0 0 40px rgba(30, 215, 96, 0.55), 0 22px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.35);
                        }
                        .fx-orb.active svg { transform: scale(1.3); filter: drop-shadow(0 0 8px rgba(30,215,96,0.9)); }
                        .fx-orb.active::before, .fx-orb.active::after {
                            content: ''; position: absolute; inset: -2px; border-radius: 50%;
                            border: 1px solid rgba(30, 215, 96, 0.6);
                            animation: fxPing 2.6s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
                            pointer-events: none;
                        }
                        .fx-orb.active::after { animation-delay: 1.3s; }
                        @keyframes fxPing {
                            0%   { transform: scale(1); opacity: 0.8; }
                            100% { transform: scale(1.9); opacity: 0; }
                        }

                        /* ground shadow under each orb (levitation) */
                        .fx-shadow {
                            position: absolute; left: -22px; top: calc(var(--lift) - 6px);
                            width: 44px; height: 8px; border-radius: 50%;
                            background: radial-gradient(closest-side, rgba(30,215,96,0.35), transparent);
                            animation: fxShadow 4.8s ease-in-out infinite;
                            pointer-events: none;
                        }
                        @keyframes fxShadow {
                            0%, 100% { transform: scaleX(1); opacity: 0.8; }
                            50% { transform: scaleX(0.7); opacity: 0.4; }
                        }

                        /* ---------- Active label above the apex ---------- */
                        .fx-apex-label {
                            position: absolute; left: 50%;
                            bottom: calc(var(--horizon) + var(--lift) + 58px);
                            transform: translateX(-50%);
                            z-index: 25; pointer-events: none;
                            display: flex; align-items: center; gap: 10px;
                            white-space: nowrap;
                        }

                        /* ---------- Bottom interaction halves ---------- */
                        .fx-zone {
                            position: absolute; left: 0; right: 0; bottom: 0;
                            height: calc(var(--horizon) + var(--lift) + 110px);
                            z-index: 20;
                        }
                        .fx-half {
                            position: absolute; top: 0; bottom: 0; width: 50%;
                            cursor: pointer;
                            transition: background 0.4s ease;
                        }
                        .fx-half.left  { left: 0;  }
                        .fx-half.right { right: 0; }
                        .fx-half.left:hover  { background: radial-gradient(60% 80% at 0% 80%, rgba(30,215,96,0.07), transparent 70%); }
                        .fx-half.right:hover { background: radial-gradient(60% 80% at 100% 80%, rgba(30,215,96,0.07), transparent 70%); }

                        /* ---------- Segment progress ---------- */
                        .fx-progress {
                            position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
                            display: flex; gap: 6px; z-index: 40;
                        }
                        .fx-seg {
                            width: 28px; height: 3px; border-radius: 3px;
                            background: rgba(255,255,255,0.14);
                            overflow: hidden; cursor: pointer; position: relative;
                        }
                        .fx-seg.done { background: rgba(30,215,96,0.45); }
                        .fx-seg > i {
                            position: absolute; inset: 0; transform-origin: left; transform: scaleX(0);
                            background: var(--g); box-shadow: 0 0 8px var(--g);
                        }
                        .fx-seg.active > i { animation: fxFill var(--fx-dur, 8s) linear forwards; }
                        .fx-paused .fx-seg.active > i { animation-play-state: paused; }
                        @keyframes fxFill { to { transform: scaleX(1); } }

                        /* ---------- Content stage ---------- */
                        .fx-content {
                            position: absolute; left: 0; right: 0; top: 0;
                            bottom: calc(var(--horizon) + var(--lift) + 100px);
                            z-index: 10;
                            padding: clamp(18px, 3.2vh, 36px) clamp(28px, 4vw, 64px) 0;
                            display: grid;
                            grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
                            gap: clamp(24px, 3vw, 56px);
                            align-items: stretch;
                        }

                        .fx-rise { opacity: 0; animation: fxRise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
                        @keyframes fxRise {
                            0%   { opacity: 0; transform: translateY(18px); filter: blur(6px); }
                            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
                        }

                        .fx-title {
                            font-size: clamp(44px, 9vh, 116px);
                            line-height: 0.92;
                            color: #fff;
                            text-shadow: 0 0 28px rgba(30, 215, 96, 0.35);
                        }
                        .fx-title .g { color: var(--g); }

                        .fx-stat-num { font-size: clamp(22px, 3.6vh, 38px); line-height: 1; color: #fff; }
                        .fx-stat-num.hl { color: var(--g); text-shadow: 0 0 18px rgba(30,215,96,0.5); }

                        .fx-glass {
                            position: relative;
                            border-radius: 22px;
                            background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015) 40%, rgba(30,215,96,0.04));
                            border: 1px solid rgba(255, 255, 255, 0.10);
                            backdrop-filter: blur(18px);
                            -webkit-backdrop-filter: blur(18px);
                            box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10);
                            overflow: hidden;
                        }
                        .fx-glass::before {
                            content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
                            background: linear-gradient(90deg, transparent, rgba(30,215,96,0.8), transparent);
                        }
                        .fx-scan {
                            position: absolute; left: 0; right: 0; height: 60px; top: -60px;
                            background: linear-gradient(180deg, transparent, rgba(30,215,96,0.06), transparent);
                            animation: fxScan 5s linear infinite;
                            pointer-events: none;
                        }
                        @keyframes fxScan { to { top: 110%; } }

                        .fx-bullet { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; }
                        .fx-bullet::before {
                            content: ''; width: 6px; height: 6px; margin-top: 7px; margin-left: 2px;
                            background: var(--g); box-shadow: 0 0 8px var(--g);
                        }
                        .fx-bullet code {
                            font-family: 'JetBrains Mono', monospace; font-size: 0.86em;
                            color: #b9f6cf; background: rgba(30,215,96,0.08);
                            padding: 0 4px; border-radius: 4px;
                        }
                        .fx-bullet strong { color: #fff; font-weight: 600; }

                        .fx-row {
                            display: flex; justify-content: space-between; align-items: center;
                            padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.08);
                            font-family: 'JetBrains Mono', monospace; font-size: 11px;
                        }
                        .fx-row:last-child { border-bottom: 0; }

                        .fx-chip {
                            font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em;
                            padding: 3px 10px; border-radius: 999px;
                            border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.65);
                            background: rgba(255,255,255,0.03);
                        }

                        .fx-watermark {
                            position: absolute; right: clamp(20px, 3vw, 48px); top: 6px;
                            font-size: clamp(120px, 26vh, 260px); line-height: 1;
                            color: rgba(255,255,255,0.025);
                            z-index: 1; pointer-events: none;
                        }
                    </style>

                    <div class="fx-root" id="fx-root">

                        <!-- Deep space backdrop -->
                        <canvas class="fx-stars" id="fx-stars"></canvas>
                        <div class="fx-nebula"></div>
                        <div class="fx-grid"></div>
                        <div class="fx-aurora"></div>
                        <div class="fx-watermark fx-dot" id="fx-watermark">01</div>

                        <!-- Planet horizon -->
                        <div class="fx-orbit-ring"></div>
                        <div class="fx-planet"></div>

                        <!-- Feature content (rendered directly on space, no big box) -->
                        <div class="fx-content" id="fx-content"></div>

                        <!-- Active feature label above apex -->
                        <div class="fx-apex-label" id="fx-apex-label"></div>

                        <!-- Bottom interaction: click left half = previous, right half = next, wheel = rotate -->
                        <div class="fx-zone" id="fx-zone" data-no-nav>
                            <div class="fx-half left" onclick="rotateArc(-1)"></div>
                            <div class="fx-half right" onclick="rotateArc(1)"></div>
                        </div>

                        <!-- Orbiting icon orbs -->
                        <div class="fx-pivot" id="fx-pivot" data-no-nav></div>

                        <!-- Segment progress -->
                        <div class="fx-progress" id="fx-progress" data-no-nav></div>
                    </div>

                    <script>
                        (function () {
                            const ICONS = {
                                cpu:    '<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
                                plug:   '<path d="M9 7V2M15 7V2M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v5"/>',
                                board:  '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4M6 8h2M6 11h2M11 8h7M11 11h5"/>',
                                timer:  '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M19 5l1.5 1.5"/>',
                                code:   '<path d="M8 6l-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/>',
                                zap:    '<path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>',
                                export: '<path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>'
                            };
                            const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

                            const FEATURES = [
                                {
                                    icon: 'cpu', code: 'CPU CORE', accent: 'CORE',
                                    th: 'ฮาร์ดแวร์ & สถาปัตยกรรม CPU 32-bit',
                                    tagline: 'คอร์ OpenMIPS 5-Stage Pipeline + RISC-V RV32IM พร้อมวงจรหาร div.v 32 ไซเคิล ดันคล็อกทะลุ 28.88 MHz',
                                    stats: [['28.88', 'MHz CLOCK', true], ['+722%', 'TIMING BOOST', true], ['+5.34', 'NS SLACK', false], ['5', 'STAGES', false]],
                                    bullets: [
                                        '<strong>5-Stage Pipeline</strong> — <code>IF</code> → <code>ID</code> → <code>EX</code> → <code>MEM</code> → <code>WB</code> พร้อม Hazard Detection, Forwarding และ Branch Delay Slot',

                                        '<strong>div.v Multi-Cycle Divider</strong> — ตัวหาร 32 สเต็ป แก้คอขวด Timing บน Artix-7 จาก 3.51 → 28.88 MHz ผ่านเกณฑ์ 25 MHz ของ Nexys A7'
                                    ],
                                    side: { title: 'PIPELINE TRACE', rows: [['IF', 'ADDIU $t0,$zero,1', '#1ED760'], ['ID', 'Decode R / I-Type', '#7dd3fc'], ['EX', 'ALU · Div 32-step', '#fcd34d'], ['MEM', 'BRAM R/W', '#c4b5fd'], ['WB', '$t0 ← result', '#fca5a5']] },
                                    tags: ['MIPS32', 'RV32IM', 'HAZARD UNIT', 'ARTIX-7']
                                },
                                {
                                    icon: 'plug', code: 'CUSTOM CPU', accent: 'CPU',
                                    th: 'ระบบนำเข้า CPU & ผูกขาอัตโนมัติ',
                                    tagline: 'Setup Wizard + HDL AST Parser อ่าน Verilog/VHDL แล้วผูกบัสเข้ากับ Address จริงของบอร์ดให้อัตโนมัติ',
                                    stats: [['AST', 'HDL PARSER', true], ['AUTO', 'MMIO BIND', true], ['16×16', 'LED / SW', false], ['6', 'DEVICES', false]],
                                    bullets: [
                                        '<strong>Setup Wizard & HDL AST Parser</strong> — สแกนพอร์ต <code>clk</code> <code>rst</code> <code>data_bus</code> <code>addr_bus</code> ออกมาเอง ไม่ต้องกรอกด้วยมือ',
                                        '<strong>Auto MMIO Bus Binding</strong> — เชื่อมบัสหน่วยความจำของ CPU เข้ากับอุปกรณ์จริงบน Nexys A7 ครบทุกตัว'

                                    bullets: [

                                    ],
                                    side: { title: 'OUTPUT FORMATS', rows: [['VIVADO SOC', '.v .xdc .tcl', '#c4b5fd'], ['ROM', '.vhd / .v', '#1ED760'], ['BRAM', '.coe', '#fcd34d'], ['MACHINE', '.txt / .bin', '#7dd3fc'], ['WAVE', '.vcd', '#fca5a5']] },
                                    tags: ['VIVADO', 'VHDL', 'VERILOG', 'GTKWAVE']

                            const TOTAL = FEATURES.length;
                            const DURATION = 8000;
                            let active = 0;
                            let built = false;
                            let timer = null;
                            let hoverPause = false;

                            const $ = (id) => document.getElementById(id);
                            const root = () => $('fx-root');
                            const slideEl = () => root() && root().closest('.slide');
                            const isOnScreen = () => { const s = slideEl(); return s && s.classList.contains('active'); };
                            const pad = (n) => String(n).padStart(2, '0');

                            /* ---------------- Text scramble (dot-matrix decode) ---------------- */
                            function scramble(el, finalText) {
                                const glyphs = '01#%&*+<>/=?ABCDEFXYZ';
                                const len = finalText.length;
                                let frame = 0;
                                const totalFrames = 22;
                                cancelAnimationFrame(el._raf);
                                const tick = () => {
                                    let out = '';
                                    for (let i = 0; i < len; i++) {
                                        const ch = finalText[i];
                                        const revealAt = (i / len) * totalFrames * 0.8;
                                        if (ch === ' ' || frame >= revealAt + 6) out += ch;
                                        else out += glyphs[Math.floor(Math.random() * glyphs.length)];
                                    }
                                    el.textContent = out;
                                    frame++;
                                    if (frame <= totalFrames + 6) el._raf = requestAnimationFrame(tick);
                                    else el.textContent = finalText;
                                };
                                tick();
                            }

                            /* ---------------- Build orbs & progress ---------------- */
                            function build() {
                                const pivot = $('fx-pivot');
                                const prog = $('fx-progress');
                                if (!pivot || !prog) return false;

                                pivot.innerHTML = '';
                                prog.innerHTML = '';
                                FEATURES.forEach((f, i) => {
                                    const pos = document.createElement('div');
                                    pos.className = 'fx-orb-pos';
                                    pos.id = 'fx-pos-' + i;
                                    pos.innerHTML = `
                                        <div class="fx-orb-float" style="animation-delay:${(i * 0.55).toFixed(2)}s">
                                            <div class="fx-shadow" style="animation-delay:${(i * 0.55).toFixed(2)}s"></div>
                                            <div class="fx-orb" id="fx-orb-${i}" title="${f.code}">${svg(f.icon)}</div>
                                        </div>`;
                                    pos.querySelector('.fx-orb').addEventListener('click', (e) => { e.stopPropagation(); setActive(i); });
                                    pivot.appendChild(pos);

                                    const seg = document.createElement('div');
                                    seg.className = 'fx-seg';
                                    seg.innerHTML = '<i></i>';
                                    seg.addEventListener('click', (e) => { e.stopPropagation(); setActive(i); });
                                    prog.appendChild(seg);
                                });

                                const zone = $('fx-zone');
                                const wheelHandler = (e) => {
                                    e.preventDefault();
                                    const now = Date.now();
                                    if (zone._last && now - zone._last < 380) return; // throttle trackpads
                                    zone._last = now;
                                    rotate((e.deltaY || e.deltaX) > 0 ? 1 : -1);
                                };
                                [zone, pivot].forEach(el => {
                                    el.addEventListener('wheel', wheelHandler, { passive: false });
                                    el.addEventListener('mouseenter', () => { hoverPause = true; root().classList.add('fx-paused'); });
                                    el.addEventListener('mouseleave', () => { hoverPause = false; root().classList.remove('fx-paused'); });
                                });
                                return true;
                            }

                            /* ---------------- Orbit positions ---------------- */
                            function layout() {
                                FEATURES.forEach((f, i) => {
                                    const pos = $('fx-pos-' + i);
                                    const orb = $('fx-orb-' + i);
                                    if (!pos || !orb) return;
                                    let diff = i - active;
                                    // wrap around so the globe looks endless (features on both sides)
                                    if (diff > TOTAL / 2) diff -= TOTAL;
                                    if (diff < -TOTAL / 2) diff += TOTAL;
                                    const prev = pos._diff;
                                    if (prev !== undefined && Math.abs(diff - prev) > 1.5) {
                                        // jumping across the far side: teleport without sweeping across the screen
                                        pos.style.transition = 'none';
                                        pos.style.setProperty('--fx-a', `calc(var(--step) * ${diff + (diff > 0 ? 1 : -1)})`);
                                        pos.style.opacity = 0;
                                        void pos.offsetWidth;
                                        pos.style.transition = '';
                                    }
                                    pos._diff = diff;
                                    pos.style.setProperty('--fx-a', `calc(var(--step) * ${diff})`);
                                    const d = Math.abs(diff);
                                    pos.style.opacity = d === 0 ? 1 : Math.max(0.18, 0.92 - d * 0.2).toFixed(2);
                                    pos.style.zIndex = 30 - d;
                                    orb.classList.toggle('active', d === 0);
                                });

                                document.querySelectorAll('#fx-progress .fx-seg').forEach((s, i) => {
                                    s.classList.remove('active', 'done');
                                    if (i < active) s.classList.add('done');
                                    if (i === active) {
                                        void s.offsetWidth; // restart fill animation
                                        s.classList.add('active');
                                    }
                                });
                                const r = root();
                                if (r) r.style.setProperty('--fx-dur', DURATION + 'ms');
                            }

                            /* ---------------- Content render ---------------- */
                            function render() {
                                const f = FEATURES[active];
                                const box = $('fx-content');
                                if (!box) return;

                                const wm = $('fx-watermark');
                                if (wm) wm.textContent = pad(active + 1);

                                const apex = $('fx-apex-label');
                                if (apex) {
                                    apex.innerHTML = `
                                        <span class="fx-rise fx-mono text-[10px] tracking-[0.3em] text-white/40">${pad(active + 1)} / ${pad(TOTAL)}</span>
                                        <span class="fx-rise fx-dot text-[18px] text-[#1ED760]" style="animation-delay:.05s;text-shadow:0 0 14px rgba(30,215,96,.6)">${f.code}</span>`;
                                }

                                let d = 0;
                                const delay = () => `animation-delay:${(d++ * 0.06).toFixed(2)}s`;

                                const stats = f.stats.map(([v, l, hl], i) => `
                                    <div class="fx-rise flex-1 ${i ? 'pl-5 border-l border-white/10' : ''}" style="${delay()}">
                                        <div class="fx-dot fx-stat-num ${hl ? 'hl' : ''}">${v.replace(/\./g, '<span style="font-family:Inter;font-weight:700">.</span>')}</div>
                                        <div class="fx-mono text-[9.5px] tracking-[0.18em] text-white/45 mt-2">${l}</div>
                                    </div>`).join('');

                                const tags = f.tags.map(t => `<span class="fx-chip">${t}</span>`).join('');

                                const bullets = f.bullets.map(b => `
                                    <li class="fx-rise fx-bullet text-[clamp(12px,1.55vh,14px)] leading-[1.6] text-white/65" style="${delay()}">
                                        <span>${b}</span>
                                    </li>`).join('');

                                let sideHtml;
                                if (f.side.code) {
                                    const esc = f.side.code.replace(/&/g, '&amp;').replace(/</g, '&lt;');
                                    sideHtml = `<pre class="fx-mono text-[11.5px] leading-[1.7] text-[#b9f6cf] whitespace-pre m-0">${esc}</pre>`;
                                } else {
                                    sideHtml = '<div class="grid grid-cols-2 gap-x-6">' + f.side.rows.map(([k, v, c]) => `
                                        <div class="fx-row">
                                            <span style="color:${c}" class="font-semibold">${k}</span>
                                            <span class="text-white/60">${v}</span>
                                        </div>`).join('') + '</div>';
                                }

                                const titleWords = f.code.split(' ');
                                const plain = titleWords.length > 1 ? titleWords.slice(0, -1).join(' ') + ' ' : '';

                                box.innerHTML = `
                                    <!-- LEFT: Hero -->
                                    <div class="flex flex-col justify-between min-h-0">
                                        <div>
                                            <div class="fx-rise flex items-center gap-3 mb-4" style="${delay()}">
                                                <span class="glyph-green-dot"></span>
                                                <span class="fx-mono text-[10.5px] tracking-[0.32em] text-[#1ED760]">FEATURE ${pad(active + 1)}</span>
                                                <span class="h-px w-16 bg-gradient-to-r from-[#1ED760]/60 to-transparent"></span>
                                                <span class="fx-mono text-[10.5px] tracking-[0.32em] text-white/35">FPGA STUDIO v4.3</span>
                                            </div>
                                            <h2 class="fx-rise fx-dot fx-title uppercase" style="${delay()}">
                                                <span id="fx-title-plain">${plain}</span><span class="g" id="fx-title-accent">${titleWords[titleWords.length - 1]}</span>
                                            </h2>
                                            <h3 class="fx-rise fx-thai text-white font-semibold mt-4 text-[clamp(17px,2.6vh,26px)] tracking-tight" style="${delay()}">${f.th}</h3>
                                            <p class="fx-rise text-white/50 mt-2 text-[clamp(12.5px,1.7vh,15px)] leading-relaxed max-w-[46ch]" style="${delay()}">${f.tagline}</p>
                                        </div>
                                        <div>
                                            <div class="flex items-end mt-5">${stats}</div>
                                            <div class="fx-rise flex flex-wrap gap-2 mt-5" style="${delay()}">${tags}</div>
                                        </div>
                                    </div>

                                    <!-- RIGHT: Glass spec card -->
                                    <div class="fx-rise fx-glass flex flex-col min-h-0 p-[clamp(16px,2.4vh,26px)]" style="animation-delay:.12s">
                                        <div class="fx-scan"></div>
                                        <div class="flex items-center justify-between mb-3">
                                            <span class="fx-mono text-[10px] tracking-[0.3em] text-white/40">WHAT'S INSIDE</span>
                                            <span class="fx-mono text-[10px] tracking-[0.2em] text-[#1ED760]">● LIVE SPEC</span>
                                        </div>
                                        <ul class="space-y-[clamp(6px,1.1vh,12px)] flex-1 min-h-0 overflow-hidden">${bullets}</ul>
                                        <div class="mt-3 pt-3 border-t border-white/10">
                                            <div class="fx-mono text-[10px] tracking-[0.3em] text-white/40 mb-1">${f.side.title}</div>
                                            ${sideHtml}
                                        </div>
                                    </div>`;

                                // Dot-matrix decode effect on the headline
                                const pEl = $('fx-title-plain');
                                const aEl = $('fx-title-accent');
                                if (pEl && plain) scramble(pEl, plain);
                                if (aEl) scramble(aEl, titleWords[titleWords.length - 1]);
                            }

                            /* ---------------- Controls ---------------- */
                            function setActive(i) {
                                active = (i + TOTAL) % TOTAL;
                                layout();
                                render();
                                restartTimer();
                            }
                            function rotate(dir) { setActive(active + dir); }

                            function restartTimer() {
                                clearInterval(timer);
                                timer = setInterval(() => {
                                    if (!hoverPause && isOnScreen()) setActive(active + 1);
                                }, DURATION);
                            }

                            /* ---------------- Starfield ---------------- */
                            let starsStarted = false;
                            function startStars() {
                                if (starsStarted) return;
                                const canvas = $('fx-stars');
                                if (!canvas) return;
                                starsStarted = true;
                                const ctx = canvas.getContext('2d');
                                let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
                                let stars = [];
                                let shooting = null;
                                let mx = 0, my = 0;

                                function resize() {
                                    const r = canvas.getBoundingClientRect();
                                    if (!r.width) return;
                                    W = r.width; H = r.height;
                                    canvas.width = W * dpr; canvas.height = H * dpr;
                                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                                    const count = Math.round((W * H) / 5200);
                                    stars = Array.from({ length: count }, () => ({
                                        x: Math.random() * W,
                                        y: Math.random() * H,
                                        z: Math.random() * 0.9 + 0.1,
                                        p: Math.random() * Math.PI * 2,
                                        tw: 0.6 + Math.random() * 1.8,
                                        g: Math.random() < 0.12
                                    }));
                                }
                                window.addEventListener('resize', resize);
                                window.addEventListener('mousemove', (e) => {
                                    mx = (e.clientX / window.innerWidth - 0.5);
                                    my = (e.clientY / window.innerHeight - 0.5);
                                });

                                function frame(t) {
                                    requestAnimationFrame(frame);
                                    if (!isOnScreen()) return;
                                    if (!W) { resize(); if (!W) return; }
                                    ctx.clearRect(0, 0, W, H);
                                    const time = t / 1000;
                                    for (const s of stars) {
                                        s.x -= s.z * 0.06;
                                        if (s.x < -4) s.x = W + 4;
                                        const a = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * s.tw + s.p))) * s.z;
                                        const x = s.x - mx * 22 * s.z;
                                        const y = s.y - my * 14 * s.z;
                                        const size = s.z * 1.4;
                                        ctx.fillStyle = s.g ? `rgba(120,255,170,${a})` : `rgba(255,255,255,${a})`;
                                        ctx.fillRect(x, y, size, size);
                                    }
                                    // occasional shooting star
                                    if (!shooting && Math.random() < 0.004) {
                                        shooting = { x: Math.random() * W * 0.7 + W * 0.2, y: Math.random() * H * 0.35, l: 0 };
                                    }
                                    if (shooting) {
                                        shooting.l += 14;
                                        const sx = shooting.x - shooting.l, sy = shooting.y + shooting.l * 0.35;
                                        const grad = ctx.createLinearGradient(sx, sy, sx + 120, sy - 42);
                                        grad.addColorStop(0, 'rgba(190,255,215,0.9)');
                                        grad.addColorStop(1, 'rgba(190,255,215,0)');
                                        ctx.strokeStyle = grad; ctx.lineWidth = 1.2;
                                        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 120, sy - 42); ctx.stroke();
                                        if (shooting.l > W * 0.5) shooting = null;
                                    }
                                }
                                resize();
                                requestAnimationFrame(frame);
                            }

                            /* ---------------- Public API ---------------- */
                            window.initArcCarousel = function () {
                                if (!built) built = build();
                                if (!built) return;
                                layout();
                                render();
                                restartTimer();
                                startStars();
                            };
                            window.updateArcPositions = layout;
                            window.setArcActive = setActive;
                            window.rotateArc = rotate;

                            window.addEventListener('keydown', (e) => {
                                if (!isOnScreen()) return;
                                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') rotate(-1);
                                else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') rotate(1);
                                else if (e.key >= '1' && e.key <= '7') setActive(parseInt(e.key, 10) - 1);
                            });

                            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', window.initArcCarousel);
                            else window.initArcCarousel();
                        })();
                    </script>

                </section>

            </div>
        </div>
    </main>
