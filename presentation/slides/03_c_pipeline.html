<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPGA STUDIO — 04. SILICON PIPELINE VIDEO</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600;800;900&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600;700&family=Prompt:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/nothing.css">
</head>
<body class="h-screen w-screen m-0 p-0 relative overflow-hidden">

    <!-- FULLSCREEN SLIDE VIEWPORT -->
    <main class="w-screen h-screen m-0 p-0 relative z-10 overflow-hidden">
        <div id="carousel-viewport">
            <div id="carousel-track">

                <!-- ======================================================== -->
                <!-- SLIDE 4: SILICON PIPELINE VIDEO (RISES UP FROM PLANET)   -->
                <!-- ======================================================== -->
                <section class="slide active fx-slide w-full h-full" id="pipeline-video-slide" data-slide="4" data-speaker="SPEAKER // C-TO-SILICON PIPELINE">

                    <style>
                        .pv-stage {
                            position: relative;
                            z-index: 10;
                            width: 100%;
                            height: 100%;
                            max-width: 1540px;
                            margin: 0 auto;
                            padding: clamp(20px, 3vh, 36px) clamp(24px, 3.2vw, 56px);
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                            align-items: center;
                            gap: clamp(12px, 1.8vh, 20px);
                        }

                        /* High-orbit entry animation as camera ascends above the world */
                        .pv-header-bar {
                            transform: translate3d(0, -32px, 0);
                            opacity: 0;
                            transition:
                                transform 0.92s cubic-bezier(0.28, 0.0, 0.2, 1),
                                opacity 0.92s cubic-bezier(0.28, 0.0, 0.2, 1);
                            will-change: transform, opacity;
                        }

                        .slide.active .pv-header-bar {
                            transform: translate3d(0, 0, 0);
                            opacity: 1;
                        }

                        .pv-rise-card {
                            width: 100%;
                            max-width: 1360px;
                            transform: translate3d(0, -54px, 0) scale(0.95);
                            opacity: 0;
                            transition:
                                transform 0.92s cubic-bezier(0.28, 0.0, 0.2, 1),
                                opacity 0.92s cubic-bezier(0.28, 0.0, 0.2, 1);
                            will-change: transform, opacity;
                        }

                        .slide.active .pv-rise-card {
                            transform: translate3d(0, 0, 0) scale(1);
                            opacity: 1;
                        }

                        .pv-frame {
                            position: relative;
                            width: 100%;
                            border-radius: 22px;
                            overflow: hidden;
                            background: #000000;
                            border: 1px solid rgba(30, 215, 96, 0.32);
                            box-shadow:
                                0 0 70px rgba(30, 215, 96, 0.14),
                                0 32px 90px rgba(0, 0, 0, 0.88),
                                inset 0 1px 0 rgba(255, 255, 255, 0.14);
                        }

                        .pv-frame::before {
                            content: '';
                            position: absolute;
                            top: 0;
                            left: 12%;
                            right: 12%;
                            height: 1px;
                            z-index: 5;
                            background: linear-gradient(90deg, transparent, rgba(30, 215, 96, 0.9), transparent);
                            pointer-events: none;
                        }

                        .pv-video {
                            width: 100%;
                            max-height: 75vh;
                            aspect-ratio: 16 / 9;
                            object-fit: contain;
                            display: block;
                            background: #000;
                        }

                        .pv-controls {
                            display: flex;
                            align-items: center;
                            gap: 12px;
                            padding: 10px 18px;
                            background: rgba(6, 11, 8, 0.92);
                            border-top: 1px solid rgba(255, 255, 255, 0.09);
                            backdrop-filter: blur(14px);
                        }

                        .pv-btn {
                            cursor: pointer;
                            padding: 5px 12px;
                            border-radius: 999px;
                            font-family: 'JetBrains Mono', monospace;
                            font-size: 10.5px;
                            letter-spacing: 0.1em;
                            border: 1px solid rgba(30, 215, 96, 0.4);
                            background: rgba(30, 215, 96, 0.1);
                            color: #1ED760;
                            transition: all 0.2s ease;
                            flex-shrink: 0;
                        }
                        .pv-btn:hover {
                            background: rgba(30, 215, 96, 0.22);
                            color: #fff;
                        }

                        .pv-chap {
                            cursor: pointer;
                            padding: 3px 9px;
                            border-radius: 6px;
                            font-family: 'JetBrains Mono', monospace;
                            font-size: 9.5px;
                            letter-spacing: 0.06em;
                            color: rgba(255, 255, 255, 0.55);
                            background: rgba(255, 255, 255, 0.04);
                            border: 1px solid rgba(255, 255, 255, 0.08);
                            transition: all 0.2s ease;
                            white-space: nowrap;
                        }
                        .pv-chap:hover {
                            color: #1ED760;
                            border-color: rgba(30, 215, 96, 0.45);
                            background: rgba(30, 215, 96, 0.08);
                        }

                        .pv-scrubber {
                            flex: 1;
                            height: 5px;
                            border-radius: 999px;
                            background: rgba(255, 255, 255, 0.14);
                            cursor: pointer;
                            position: relative;
                            overflow: hidden;
                        }
                        .pv-scrubber-fill {
                            height: 100%;
                            width: 0%;
                            background: linear-gradient(90deg, #1ED760, #6EE7B7);
                            box-shadow: 0 0 10px #1ED760;
                        }
                    </style>

                    <div class="fx-root">

                        <!-- Deep space layers -->
                        <canvas class="fx-stars"></canvas>
                        <div class="fx-nebula"></div>
                        <div class="fx-grid"></div>

                        <div class="pv-stage">

                            <!-- Compact Header Bar -->
                            <div class="pv-header-bar w-full max-w-[1360px] flex flex-wrap items-end justify-between gap-3">
                                <div>
                                    <div class="flex items-center gap-2.5 mb-1">
                                        <span class="glyph-green-dot"></span>
                                        <span class="fx-mono text-[10.5px] tracking-[0.28em] text-[#1ED760]">SILICON PIPELINE // C TO 7-SEGMENT EXECUTION</span>
                                    </div>
                                    <div class="flex flex-wrap items-baseline gap-4">
                                        <h2 class="fx-dot uppercase text-white leading-none" style="font-size: clamp(28px, 4.2vh, 48px); text-shadow: 0 0 24px rgba(30,215,96,0.3);">
                                            <span data-scramble="PIPELINE ">PIPELINE </span><span class="text-[#1ED760]" data-scramble="EXECUTION">EXECUTION</span>
                                        </h2>
                                        <span class="fx-thai text-white/85 font-semibold text-[clamp(14px,1.9vh,19px)]">
                                            จากโค้ดภาษา C ผ่านสาย USB เข้าสู่ 5-Stage CPU จนแสดงผลออกจอ 7-Segment
                                        </span>
                                    </div>
                                </div>

                                <div class="hidden lg:flex items-center gap-2">
                                    <span class="fx-chip fx-chip-green">C → GCC → UART → 5-STAGE CPU → 7-SEG</span>
                                </div>
                            </div>

                            <!-- Rising Video Cinema Card -->
                            <div class="pv-rise-card">
                                <div class="pv-frame">
                                    <video
                                        id="pipeline-video"
                                        class="pv-video"
                                        src="../assets/pipeline_demo.mp4"
                                        playsinline
                                        preload="auto"
                                        autoplay
                                        muted
                                        loop
                                        onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='pipeline_demo.mp4';}"
                                    ></video>

                                    <!-- Interactive Video Controls & Chapter Quick-Jumps (data-no-nav prevents accidental slide change) -->
                                    <div class="pv-controls" data-no-nav>
                                        <button type="button" id="pv-play-btn" class="pv-btn" onclick="window.togglePipelineVideo()">
                                            ⏸ PAUSE
                                        </button>

                                        <div class="pv-scrubber" id="pv-scrubber" onclick="window.seekPipelineVideo(event)">
                                            <div class="pv-scrubber-fill" id="pv-scrubber-fill"></div>
                                        </div>

                                        <span id="pv-time" class="fx-mono text-[10.5px] text-white/60 whitespace-nowrap shrink-0">00:00 / 02:53</span>

                                        <div class="hidden xl:flex items-center gap-1.5 pl-2 border-l border-white/10">
                                            <button type="button" class="pv-chap" onclick="window.jumpPipelineVideo(0)">10C3</button>
                                            <button type="button" class="pv-chap" onclick="window.jumpPipelineVideo(8)">FLOW</button>
                                            <button type="button" class="pv-chap" onclick="window.jumpPipelineVideo(17)">C CODE</button>
                                            <button type="button" class="pv-chap" onclick="window.jumpPipelineVideo(28)">OPCODE</button>
                                            <button type="button" class="pv-chap" onclick="window.jumpPipelineVideo(40)">UART</button>
                                            <button type="button" class="pv-chap" onclick="window.jumpPipelineVideo(59)">IF·ID·EX·MEM</button>
                                            <button type="button" class="pv-chap" onclick="window.jumpPipelineVideo(138)">7-SEG 191Hz</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>

                    </div>

                    <script>
                    (function() {
                        const vid  = document.getElementById('pipeline-video');
                        const btn  = document.getElementById('pv-play-btn');
                        const fill = document.getElementById('pv-scrubber-fill');
                        const timeEl = document.getElementById('pv-time');
                        const scrub  = document.getElementById('pv-scrubber');
                        if (!vid) return;

                        if (window.location.search.includes('settle=1')) {
                            vid.addEventListener('loadedmetadata', () => { vid.currentTime = 3.0; }, { once: true });
                        }

                        function fmt(sec) {
                            if (!isFinite(sec) || sec < 0) return '00:00';
                            const m = Math.floor(sec / 60);
                            const s = Math.floor(sec % 60);
                            return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
                        }

                        vid.addEventListener('timeupdate', () => {
                            const dur = vid.duration || 173;
                            const pct = Math.min(100, (vid.currentTime / dur) * 100);
                            if (fill) fill.style.width = pct.toFixed(2) + '%';
                            if (timeEl) timeEl.textContent = fmt(vid.currentTime) + ' / ' + fmt(dur);
                        });

                        vid.addEventListener('play', () => {
                            if (btn) btn.textContent = '⏸ PAUSE';
                        });

                        vid.addEventListener('pause', () => {
                            if (btn) btn.textContent = '▶ PLAY';
                        });

                        window.togglePipelineVideo = function() {
                            if (vid.paused) vid.play();
                            else vid.pause();
                        };

                        window.jumpPipelineVideo = function(sec) {
                            vid.currentTime = sec;
                            vid.play().catch(() => {});
                        };

                        window.seekPipelineVideo = function(e) {
                            if (!scrub) return;
                            const rect = scrub.getBoundingClientRect();
                            const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                            vid.currentTime = ratio * (vid.duration || 173);
                        };
                    })();
                    </script>

                </section>

            </div>
        </div>
    </main>

    <!-- SPEAKER CUES DRAWER -->
    <div id="cues-drawer" class="fixed bottom-10 left-1/2 -translate-x-1/2 max-w-4xl w-[92%] bento-card p-5 border-[#484848] shadow-2xl z-50 hidden transition-all">
        <div class="flex justify-between items-center mb-2 border-b border-[#282828] pb-2">
            <div class="flex items-center space-x-2">
                <span class="glyph-red-dot"></span>
                <span class="mono text-xs text-red-400 font-bold uppercase" id="cue-title">CUE SHEET (กดปุ่ม C)</span>
            </div>
            <button onclick="toggleCues()" class="text-xs mono text-white/50 hover:text-white">[ ปิด X ]</button>
        </div>
        <p id="cue-content" class="text-xs md:text-sm text-white/90 leading-relaxed whitespace-pre-line font-normal"></p>
    </div>

    <script>
        window.prevSectionUrl = '02_features.html';
        window.nextSectionUrl = '04_live_demo.html';
        window.speakerScripts = {
            4: "【บทพูดเพจ 4: วิดีโอจำลองการทำงาน C-to-Silicon Pipeline】\nเมื่อเลื่อนขึ้นมาจากหน้าฟีเจอร์ คลิปนี้จะแสดงเส้นทางตั้งแต่การเขียนโค้ดภาษา C คำนวณ 10 เลือก 3 (10C3 = 120) แปลงผ่าน GCC เป็นรหัสเครื่อง 32-bit ส่งผ่านสาย UART เข้าสู่หน่วยความจำคำสั่ง แล้วรันผ่าน 5-Stage Pipeline (IF, ID, EX, MEM, WB) จนแสดงผลออกจอ 7-Segment ด้วยความถี่สแกน 191 Hz ครับ"
        };
    </script>
    <script src="../js/presentation.js"></script>
</body>
</html>
