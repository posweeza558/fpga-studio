<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPGA STUDIO — 00. COVER</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Prompt:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/nothing.css">
</head>
<body class="h-screen w-screen flex flex-col justify-between p-6 relative overflow-hidden">

    <!-- Interactive Warping Dot Matrix Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- TOP BAR (CLEAN MINIMAL) -->
    <header class="w-full flex items-center justify-between pb-4 border-b border-[#282828] z-20">
        <div class="flex items-center space-x-3">
            <span class="glyph-green-dot"></span>
            <span class="mono text-xs text-[#EAEAEA] font-bold tracking-widest uppercase">FPGA STUDIO</span>
            <span class="text-white/20 text-xs">|</span>
            <span class="mono text-xs text-[#1ED760]">v4.3 RELEASE</span>
        </div>

        <div class="flex items-center space-x-4">
            <div class="mono text-sm font-bold tracking-widest text-[#EAEAEA]">
                <span id="current-slide-num">01</span> <span class="text-white/30">/</span> <span id="total-slide-num">01</span>
            </div>
            <button onclick="toggleFullscreen()" class="p-2 rounded-full border border-[#282828] hover:border-[#484848] hover:bg-[#2A2A2A] transition text-xs mono text-[#B3B3B3]" title="Full Screen (F)">
                ⛶
            </button>
        </div>
    </header>

    <!-- MAIN SLIDE CONTAINER (CAROUSEL VIEWPORT) -->
    <main class="flex-1 w-full flex items-center justify-center py-6 relative z-10 overflow-hidden">
        <div id="carousel-viewport">
            <div id="carousel-track">

                <!-- ======================================================== -->
                <!-- SLIDE: COVER (SPOTIFY DARK + NOTHING HYBRID) -->
                <!-- ======================================================== -->
                <section class="slide active flex-col items-center justify-center text-center max-w-5xl w-full h-full" data-slide="1" data-speaker="ALL // INTRODUCTION">
                    
                    <!-- Geometric Glyph Motif (เคาะขึ้นสูงขึ้น ไม่ชิดตัวหนังสือ & จุดแดงขยับนิดเดียวฟีลลูกตา) -->
                    <div class="relative mb-14 -mt-6">
                        <div class="w-32 h-32 rounded-full border border-white/20 flex items-center justify-center relative shadow-[0_0_35px_rgba(30,215,96,0.1)]">
                            <div id="eye-outer" class="w-20 h-20 rounded-full border-2 border-white/60 flex items-center justify-center relative">
                                <div id="eye-pupil-tracker" class="flex items-center justify-center will-change-transform">
                                    <span id="eye-pupil" class="glyph-red-dot"></span>
                                </div>
                            </div>
                            <div class="absolute -top-3 w-12 h-1 bg-white/80 rounded-full shadow-[0_0_12px_rgba(255,255,255,0.5)]"></div>
                            <div class="absolute -bottom-3 w-16 h-1 bg-[#1ED760] rounded-full shadow-[0_0_12px_rgba(30,215,96,0.6)]"></div>
                        </div>
                    </div>

                    <h1 class="text-6xl md:text-7xl font-bold tracking-tight uppercase ndot mb-3 text-white">
                        FPGA STUDIO
                    </h1>
                    <p class="mono text-xs md:text-sm text-[#B3B3B3] tracking-widest uppercase mb-10">
                        DUAL 32-BIT RISC EDA & COMPILATION STUDIO
                    </p>

                    <!-- Pill Badges -->
                    <div class="flex flex-wrap gap-2.5 justify-center mb-10 mono text-xs">
                        <span class="px-4 py-1.5 rounded-full bg-[#1F1F1F] border border-[#282828] text-[#EAEAEA]">OPENMIPS 32-BIT</span>
                        <span class="px-4 py-1.5 rounded-full bg-[#1F1F1F] border border-[#282828] text-[#EAEAEA]">RISC-V (RV32IM)</span>
                        <span class="px-4 py-1.5 rounded-full bg-[#1F1F1F] border border-[#282828] text-[#EAEAEA]">DIGILENT NEXYS A7-100T</span>
                        <span class="px-4 py-1.5 rounded-full bg-emerald-950/40 border border-[#1ED760]/40 text-[#1ED760]">TERM PROJECT 2026</span>
                    </div>

                    <!-- Presenter List Bento -->
                    <div class="bento-card p-4 px-10 flex items-center space-x-8 text-xs mono text-[#B3B3B3]">
                        <div>[ 01 ] VISION & HOOK</div>
                        <div class="text-white/20">•</div>
                        <div>[ 02 ] PIPELINE & MMIO</div>
                        <div class="text-white/20">•</div>
                        <div>[ 03 ] LIVE DEMO</div>
                        <div class="text-white/20">•</div>
                        <div>[ 04 ] SUPERPOWERS & IMPACT</div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- SPEAKER CUES DRAWER (กดปุ่ม C เพื่อเปิด/ปิด) -->
    <div id="cues-drawer" class="fixed bottom-10 left-1/2 -translate-x-1/2 max-w-4xl w-[92%] bento-card p-5 border-[#484848] shadow-2xl z-40 hidden transition-all">
        <div class="flex justify-between items-center mb-2 border-b border-[#282828] pb-2">
            <div class="flex items-center space-x-2">
                <span class="glyph-red-dot"></span>
                <span class="mono text-xs text-red-400 font-bold uppercase" id="cue-title">CUE SHEET (กดปุ่ม C)</span>
            </div>
            <button onclick="toggleCues()" class="text-xs mono text-white/50 hover:text-white">[ ปิด X ]</button>
        </div>
        <p id="cue-content" class="text-xs md:text-sm text-white/90 leading-relaxed whitespace-pre-line font-normal"></p>
    </div>

    <!-- SPEAKER SCRIPTS & NAVIGATION -->
    <script>
        window.prevSectionUrl = null;
        window.nextSectionUrl = '01_speaker1_challenge.html';
        window.speakerScripts = {
            1: "【บทพูดเปิดตัว: แนะนำโปรเจกต์】\nสวัสดีครับอาจารย์และเพื่อนๆ ทุกคน วันนี้กลุ่มพวกเราขอเสนอ 'FPGA Studio' เครื่องมือพัฒนาและจำลองสถาปัตยกรรมคอมพิวเตอร์แบบ All-in-One ครับ"
        };
    </script>
    <script src="../js/presentation.js"></script>
</body>
</html>
